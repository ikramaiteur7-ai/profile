<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset='utf-8'>

    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <link rel="stylesheet" href="main.css">

    <title>Club registration Form</title>
    
</head>
<body>
    <h1 class="title">Club registration Form</h1>
    <p><strong>Are you ready to start your journey with our club to grow and improve yourself??</strong>
    <br>   
    <br> <label for="FirstName">FullName:</label> <input type="text" name="FirstName" id="FirstName" placeholder="Enter your FirstName">
    <br> <label for="LastName">LastName:</label> <input type="text" name="LastName" id="LastName" placeholder="Enter your LastName">
    <br> <label for="Email">Email:  </label> <input type="email" name="Email" id="Email" placeholder="Enter your Email">
    <br> <label for="Age">Age(optional):</label> <input type="text" name="Age" id="Age" placeholder="Age">
    <br>  <label for="PhoneNumber">PhoneNumber</label> <input type="tel" name="PhoneNumber" id="PhoneNumber" placeholder="Enter your PhoneNumber">
    </p>
    <p>
    <br>sexe:
    <br><input type="radio" name="sexe" id="Female"> <label for="Female">Female</label>
    <input type="radio" name="sexe" id="Male"> <label for="Male">Male</label>
    </p>
    <label for="Interests">Your Interests:</label>
    <select name="Interests" id="Interests">
     <option value="Art">Art</option>
     <option value="Music">Music</option>
     <option value="Sport">Sport</option>
     <option value="Lecture">Lecture</option>
     <option value="Games">Games</option>
     <option value="Other">Other</option>
    </select>
    <p>
    <label for="reason">Why do you wanna join the club?</label> 
    <br> <input type="text" name="reason" id="reason" placeholder="reason">

    <br> Would you recommend this club to a friend?
    <br> <input type="radio" name="Would you recommend this club to a friend?" id="Sure"> <label for="Sure">Sure</label>
    <input type="radio" name="Would you recommend this club to a friend?" id="Maybe"> <label for="Maybe">Maybe</label>
    <input type="radio" name="Would you recommend this club to a friend?" id="No"> <label for="No">No</label>
    <br> <label> Which departement you want to join?and why?</label>
    <br> <input type="checkbox" name="Developement" id="Developement"> <label for="Developement">Developement</label>
    <input type="checkbox" name="Visual" id="Visual"> <label for="Visual">Visual</label>
    <input type="checkbox" name="event" id="Event"> <label for="Event">Event</label>
    <input type="checkbox" name="Design" id="Design"> <label for="Design">Design</label>
    <input type="checkbox" name="HR" id="HR"> <label for="HR">HR</label>
    <input type="checkbox" name="Marketing" id="Marketing"> <label for="Marketing">Marketing</label>
    <br><label for="Reason">why?</label>
    <input type="text" name="Reason" id="Reason" placeholder="why">
    </p>
    <p> 
     <label for="Add">Anything to add:</label>
     <br><input type="text" name="Add" id="Add" placeholder="Drop it here...">  
    </p>
    <input type="submit" value="submit">
</body>
</html>
